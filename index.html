body.carnet main{max-width:none;padding:0 0 130px}
body.formview main{max-width:none;padding:0 0 56px}
.hero{position:relative;text-align:center;color:#fff;padding:38px 18px 34px;background:radial-gradient(circle at 20% 0,#7db4ff 0,transparent 55%),linear-gradient(135deg,#3b82f6 0,#1d4ed8 60%,#1e3a8a 100%);border-bottom:6px solid #ef4444;border-radius:0 0 36px 36px;box-shadow:0 10px 30px rgba(29,78,216,.25)}
.avatar{width:150px;height:150px;border-radius:50%;background:#fff;color:#1d4ed8;border:6px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:4.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.avatar.boy{background:#dbeafe}
.avatar.girl{background:#fce7f3}
.hero h1{margin:.1em 0 .3em;font-size:2.1rem;text-shadow:0 2px 6px rgba(0,0,0,.2)}
.pill{display:inline-block;background:#fff;color:#dc2626;font-weight:700;font-size:1.05rem;padding:6px 16px;border-radius:999px;margin:6px 0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.hero .sub{font-weight:700;font-size:.95rem;margin:10px 0 0;opacity:.95}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 0}
.vbtn{background:linear-gradient(135deg,#8b5cf6,#7c3aed);color:#fff;border-radius:14px;box-shadow:0 6px 16px rgba(124,58,237,.35);margin:0 0 8px}
.vinst{font-size:.9rem;margin:2px 4px 14px}
.actions{display:grid;gap:10px;margin:14px 0 8px}
@media(min-width:560px){.actions{grid-template-columns:1fr 1fr}}
.actions button{margin:0;background:#fff;color:#1d4ed8;border:2px solid #2563eb;border-radius:14px;box-shadow:0 4px 12px rgba(37,99,235,.12)}
.fhero{padding:30px 18px 28px}
.fhero .badge{width:96px;height:96px;border-radius:50%;background:#fff;border:5px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:3rem;margin:0 auto 12px}
.fhero p{margin:.3em auto 0;max-width:420px;font-weight:700;font-size:1rem}
.formcard{background:#fff;border-radius:24px;padding:6px 20px 22px;margin:0 0 24px;box-shadow:0 8px 24px rgba(30,64,175,.12)}
.sec{background:#fff;border-radius:24px;padding:20px 22px;margin:18px 0;box-shadow:0 8px 24px rgba(30,64,175,.10)}
.sec h2{display:flex;align-items:center;gap:10px;font-size:1.3rem;line-height:1.25;margin:0 0 14px}
.sec h2 .ic{font-size:1.5rem}
.it{display:flex;align-items:flex-start;gap:12px;margin:13px 0;white-space:pre-line;overflow-wrap:anywhere}
.it::before{content:"";flex:none;width:11px;height:11px;margin-top:.5em;background:#2563eb;border-radius:3px}
.it b{font-weight:700}
.callbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:12px;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.callbar a.btn{flex:1;max-width:300px;margin:0;padding:15px 8px;color:#fff;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);background:#2563eb}
.callbar a.btn:nth-child(2){background:#ef4444}
.callbar a.btn:nth-child(3){background:#16a34a}
.callbar a.btn:nth-child(n+4){background:#7c3aed}

/* ---- Formulario ---- */
h2.fh{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;padding:10px 14px;border-radius:12px;margin:26px 0 4px;font-size:1rem;text-transform:uppercase;box-shadow:0 4px 10px rgba(37,99,235,.25)}
.formcard h2.fh:first-of-type{margin-top:18px}
label{display:block;font-weight:700;margin:14px 0 4px}
input,textarea,select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:76px}.item{display:grid;grid-template-columns:1fr auto;gap:8px;margin:6px 0}.item:has(.t){grid-template-columns:1fr 1fr auto}.item button{width:auto;margin:0;padding:10px 14px;background:#fff;color:var(--no);border:2px solid var(--no)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,a.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:700;padding:14px;border-radius:12px;border:0;background:var(--main);color:#fff;margin:10px 0;cursor:pointer}
.alt{background:#fff!important;color:var(--main)!important;border:2px solid var(--main)!important}
.call{background:#14213d}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#qr{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:12px}
small{color:#4a5b70}
.link{word-break:break-all;font-size:.8rem}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:12px}
.warn{background:#fff4e0;border:1px solid var(--alert);border-radius:10px;padding:10px;margin:10px 0}
.saved{color:var(--like);font-size:.9rem;margin:2px 0 10px}
.danger{background:#fff!important;color:var(--no)!important;border:2px solid var(--no)!important}
</style>

<body>
<main id="app"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Números colombianos de 10 dígitos reciben el 57 automáticamente
const digits = s => { const d = s.replace(/\D/g, ''); return d.length === 10 ? '57' + d : d; };
const ytId = s => { const m = s.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : (/^[\w-]{11}$/.test(s) ? s : ''); };

/* Único límite: lo que físicamente cabe en un QR (versión 40, ~2953 caracteres). La página no pone otro. */
const MAX_URL = 2953;
const STORE_KEY = 'carnet-emergencia-v1';

/* ============ Compresión: cabe mucho más texto en el mismo QR ============ */
const toB64u = bytes => {
  let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
const fromB64u = str => {
  str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '=';
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
};
const pipe = async (bytes, stream) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
async function pack(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (!('CompressionStream' in window)) return 'j' + toB64u(bytes);   // sin compresión (celulares muy viejos)
  return 'z' + toB64u(await pipe(bytes, new CompressionStream('deflate-raw')));
}
async function unpack(s) {
  let bytes = fromB64u(s.slice(1));
  if (s[0] === 'z') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
  return JSON.parse(new TextDecoder().decode(bytes));
}

/* ============ Guardado en el navegador ============ */
const save = d => { try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); return true; } catch (e) { return false; } };
const load = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } };

/* ============ TARJETA (lo que se ve al escanear el QR) ============ */
function renderCard(d) {
  const g = k => String(d[k] || '').trim();
  const list = k => (d[k] || []).map(x => String(x).trim()).filter(Boolean);
  const name = g('n'), vid = g('v');
  const contacts = (d.k || []).filter(([, t]) => t);

  // "Etiqueta: texto" -> etiqueta en negrita; sin dos puntos -> texto normal
  const item = x => {
    const m = String(x).match(/^([^:\n]{1,45}):\s*([\s\S]*)$/);
    return `<div class="it"><div>${m ? `<b>${esc(m[1])}:</b> ${esc(m[2])}` : esc(x)}</div></div>`;
  };
  const lines = a => a.filter(Boolean).map(item).join('');
  const ul = items => items.map(item).join('');
  const row = (ic, title, body) => body ? `<section class="sec"><h2><span class="ic" aria-hidden="true">${ic}</span>${title}</h2>${body}</section>` : '';

  const general = [
    'Nombre: ' + name,
    g('d') && 'Tengo diagnóstico de ' + g('d'),
    g('b'),
    g('c'),                                   // carnets viejos
    contacts.length && 'Número de contacto: ' + contacts.map(([, t]) => t).join(' - ')
  ];
  const alerta = [
    g('s') && 'Tipo de sangre: ' + g('s'),
    g('a') && 'Alergias: ' + g('a'),
    g('m') && 'Medicamentos: ' + g('m'),
    g('o') && 'Comunicación: ' + g('o')
  ];
  const incomoda = list('i').concat(g('x') ? [g('x')] : []);   // 'x' = carnets viejos ("Qué NO hacer")
  const helps = list('h'), likes = list('l');
  const calls = contacts.map(([k, t]) => `<a class="btn" href="tel:+${digits(t)}">📞 Llamar a ${esc(k || t)}</a>`).join('');
  const resumen = [g('d') && 'Tengo diagnóstico de ' + g('d'), g('b'), g('c')].filter(Boolean);
  document.title = 'Información de emergencia - ' + name;
  const sex = g('p');
  const av = sex === 'niño' ? ['boy', '👦'] : sex === 'niña' ? ['girl', '👧'] : ['', name[0].toUpperCase()];

  document.body.classList.add('carnet');
  app.innerHTML = `
    <header class="hero">
      <div class="avatar ${av[0]}" aria-hidden="true">${av[1]}</div>
      <h1>Hola, soy ${esc(name)}</h1>
      ${resumen.map(x => `<div class="pill">${esc(x)}</div>`).join(' ')}
      <p class="sub">Por favor, lee esta información para ayudarme.</p>
    </header>
    <div class="wrap">
      ${vid ? `<button class="vbtn" id="vbtn">🎵 Ponme mi video o canción favorita</button><div id="vbox" hidden></div><p class="vinst"><b>Instrucción:</b> Sube el volumen y muéstrame este video o canción, me ayuda a tranquilizarme.</p>` : ''}
      <div class="actions">
        <button id="speak">🔊 Leer instrucciones en voz alta</button>
        <button id="loc">📍 Enviar mi ubicación por WhatsApp</button>
      </div>
      ${row('👤', 'Datos generales', lines(general))}
      ${row('⚠️', 'Alerta médica y seguridad', lines(alerta))}
      ${row('🚫', 'Qué me incomoda o se me dificulta', ul(incomoda))}
      ${row('🤝', 'Cómo puedes ayudarme', ul(helps))}
      ${row('⭐', 'Gustos', ul(likes))}
      ${row('🌙', 'Sueño', lines([g('u')]))}
    </div>
    ${calls ? `<nav class="callbar">${calls}</nav>` : ''}`;

  if (vid) $('vbtn').onclick = () => {
    const box = $('vbox'), open = box.hidden;
    box.hidden = !open;
    box.innerHTML = open ? `<iframe class="video" allow="autoplay; encrypted-media" allowfullscreen src="https://www.youtube-nocookie.com/embed/${vid}?autoplay=1"></iframe>` : '';
    $('vbtn').textContent = open ? 'Ocultar' : '🎵 Ponme mi video o canción favorita';
  };

  $('speak').onclick = () => {
    if (!('speechSynthesis' in window)) return alert('Este celular no puede leer en voz alta.');
    speechSynthesis.cancel();
    const txt = [
      `Hola, soy ${name}.`,
      g('d') && 'Tengo diagnóstico de ' + g('d'), g('b'), g('c'),
      ...alerta,
      incomoda.length && 'Qué me incomoda o se me dificulta. ' + incomoda.join('. '),
      helps.length && 'Cómo puedes ayudarme. ' + helps.join('. '),
      likes.length && 'Mis gustos. ' + likes.join('. '),
      g('u') && 'Sueño. ' + g('u')
    ].filter(Boolean).join('. ');
    const u = new SpeechSynthesisUtterance(txt); u.lang = 'es-ES'; u.rate = .9;
    speechSynthesis.speak(u);
  };

  $('loc').onclick = () => {
    const to = digits((contacts[0] || [])[1] || '');
    if (!navigator.geolocation) return alert('No se pudo obtener la ubicación.');
    navigator.geolocation.getCurrentPosition(pos => {
      const maps = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
      const msg = `Encontré a ${name}. Estamos aquí: ${maps}`;
      location.href = `https://wa.me/${to}?text=${encodeURIComponent(msg)}`;
    }, () => alert('Activa la ubicación del celular y permite el acceso.'), { enableHighAccuracy: true, timeout: 10000 });
  };
}

/* ============ FORMULARIO (para el papá) ============ */
function renderForm() {
  document.body.classList.remove('carnet');
  document.body.classList.add('formview');
  const saved = load();
  app.innerHTML = `
    <header class="hero fhero">
      <div class="badge" aria-hidden="true">🛡️</div>
      <h1>Crea tu Hoja de vida</h1>
      <p>Llena los datos y genera el QR. Pégalo en la mochila, pulsera o carnet.</p>
    </header>
    <div class="wrap"><div class="formcard">
    <p class="saved" id="savedmsg" hidden>💾 Tus datos se guardan solos en este celular/computador.</p>
    ${location.protocol === 'file:' ? '<div class="warn">⚠️ Abriste el archivo desde el computador. El QR solo funcionará cuando esta página esté publicada en internet (por ejemplo en GitHub Pages).</div>' : ''}

    <h2 class="fh">Datos generales</h2>
    <label for="n">Nombre *</label><input id="n" autocomplete="off">
    <label for="p">Soy (sale como dibujo arriba del carnet)</label>
    <select id="p"><option value="">Sin indicar (sale la inicial del nombre)</option><option value="niño">Niño 👦</option><option value="niña">Niña 👧</option></select>
    <label for="d">Tengo diagnóstico de</label><input id="d" placeholder="Autismo" autocomplete="off">
    <label for="b">¿Hablas?</label>
    <input id="b" placeholder="Soy hablante" autocomplete="off">
    <label>Número de contacto * (el primero recibe tu ubicación por WhatsApp)</label>
    <div id="cl"></div>
    <button type="button" class="alt" id="cadd">➕ Agregar contacto</button>

    <h2 class="fh">Alerta médica y seguridad</h2>
    <div class="row">
      <div><label for="s">Tipo de sangre</label><input id="s" placeholder="O+"></div>
      <div><label for="a">Alergias</label><input id="a" placeholder="Ninguna"></div>
    </div>
    <label for="m">Medicamentos</label><input id="m" placeholder="Nombre, dosis y horario" autocomplete="off">
    <label for="o">Comunicación</label><input id="o" placeholder="SAAC, pictogramas y señalamientos" autocomplete="off">

    <h2 class="fh">Qué me incomoda o se me dificulta</h2>
    <div id="il"></div>
    <button type="button" class="alt" id="iadd">➕ Agregar</button>

    <h2 class="fh">Cómo puedes ayudarme</h2>
    <div id="hl"></div>
    <button type="button" class="alt" id="hadd">➕ Agregar indicación</button>

    <h2 class="fh">Gustos</h2>
    <div id="ll"></div>
    <button type="button" class="alt" id="ladd">➕ Agregar gusto</button>
    <label for="v">Video o canción favorita (link de YouTube, opcional)</label><input id="v" placeholder="https://youtu.be/...">

    <h2 class="fh">Sueño</h2>
    <textarea id="u" placeholder="Ejemplo: Tengo problemas con mi rutina del sueño. Pregunta a mis padres cómo dormí."></textarea>

    <p id="cap" aria-live="polite" style="font-size:.9rem;margin:6px 0"></p>
    <button id="go">Generar QR</button>
    <p id="err" role="alert" style="color:#b00020"></p>
    <div id="out" hidden>
      <div id="qr"></div>
      <a id="dl" class="btn" download="qr-carnet.png">Descargar QR</a>
      <a id="open" class="btn alt" target="_blank" rel="noopener">Ver el carnet</a>
      <p><small>Link del carnet:</small></p>
      <p class="link" id="url"></p>
    </div>
    <button type="button" class="danger" id="clear">🗑️ Borrar datos guardados y empezar de cero</button>
    </div></div>`;

  function addRow(list, html, values, focus) {
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = html + '<button type="button" class="x" aria-label="Quitar">✕</button>';
    d.querySelectorAll('input').forEach((inp, i) => { inp.value = (values && values[i]) || ''; });
    d.querySelector('.x').onclick = () => { d.remove(); persist(); };
    $(list).appendChild(d);
    if (focus) d.querySelector('input').focus();
  }
  const listRow = (list, first, other) => (isFirst, v, focus) => addRow(list, `<input placeholder="${isFirst ? first : other}">`, [v], focus);
  const incRow = listRow('il', 'Sonidos fuertes', 'Otra cosa que me incomoda');
  const helpRow = listRow('hl', 'Háblame suave y con órdenes cortas.', 'Otra indicación');
  const likeRow = listRow('ll', 'Libros, rompecabezas', 'Otro gusto');
  const contactRow = (first, k, t, focus) => addRow('cl', `<input class="k" placeholder="${first ? 'Acudiente' : 'Otro contacto'}"><input class="t" type="tel" placeholder="3001234567">`, [k, t], focus);

  // Lee todo lo que hay en el formulario
  const collect = () => {
    const v = id => $(id).value.trim();
    const vals = sel => [...document.querySelectorAll(sel)].map(i => i.value.trim()).filter(Boolean);
    return {
      n: v('n'), p: v('p'), d: v('d'), b: v('b'), s: v('s'), a: v('a'), m: v('m'), o: v('o'), u: v('u'), v: v('v'),
      i: vals('#il input'), h: vals('#hl input'), l: vals('#ll input'),
      k: [...document.querySelectorAll('#cl .item')].map(r => [r.querySelector('.k').value.trim(), r.querySelector('.t').value.trim()]).filter(([k, t]) => k || t)
    };
  };
  function persist() { if (save(collect())) $('savedmsg').hidden = false; updateCap(); }

  // Medidor de espacio del QR (sin bloquear: solo avisa)
  let capTimer;
  function updateCap() {
    clearTimeout(capTimer);
    capTimer = setTimeout(async () => {
      const f = collect(), data = { ...f, k: f.k.filter(([, t]) => t) };
      if (f.v) data.v = ytId(f.v) || '';
      for (const k of Object.keys(data)) if (Array.isArray(data[k]) ? !data[k].length : !data[k]) delete data[k];
      const len = (location.href.split('#')[0] + '#d=' + await pack(data)).length;
      const pct = Math.round(len / MAX_URL * 100), el = $('cap');
      if (!el) return;
      el.textContent = pct > 100 ? `⛔ Ya no cabe en el QR (${pct}%). Acorta un poco el texto.`
        : pct > 80 ? `⚠️ Espacio del QR usado: ${pct}%. El QR queda muy denso: imprímelo grande.`
        : `Espacio del QR usado: ${pct}%`;
      el.style.color = pct > 100 ? '#b00020' : pct > 80 ? '#b45309' : '#4a5b70';
    }, 300);
  }

  // Rellena con lo guardado
  for (const k of ['n', 'p', 'd', 'b', 's', 'a', 'm', 'o', 'u', 'v']) $(k).value = saved[k] || '';
  const I = saved.i && saved.i.length ? saved.i : (saved.x ? [saved.x] : ['']);   // 'x' = versión anterior
  const H = saved.h && saved.h.length ? saved.h : [''];
  const L = saved.l && saved.l.length ? saved.l : [''];
  const K = saved.k && saved.k.length ? saved.k : [['', '']];
  I.forEach((v, i) => incRow(i === 0, v));
  H.forEach((v, i) => helpRow(i === 0, v));
  L.forEach((v, i) => likeRow(i === 0, v));
  K.forEach(([k, t], i) => contactRow(i === 0, k, t));
  if (Object.keys(saved).length) $('savedmsg').hidden = false;
  updateCap();

  app.oninput = persist;
  app.onchange = persist;
  $('iadd').onclick = () => incRow(false, '', true);
  $('hadd').onclick = () => helpRow(false, '', true);
  $('ladd').onclick = () => likeRow(false, '', true);
  $('cadd').onclick = () => contactRow(false, '', '', true);
  $('go').onclick = generate;
  $('clear').onclick = () => {
    if (!confirm('¿Borrar todos los datos guardados?')) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    renderForm();
  };

  async function generate() {
    const err = $('err'), f = collect();
    const contacts = f.k.filter(([, t]) => t);
    if (!f.n || !contacts.length) { err.textContent = 'Falta el nombre y al menos un contacto con teléfono.'; return; }
    const data = { ...f, k: contacts };
    if (f.v) { const id = ytId(f.v); if (!id) { err.textContent = 'El link de YouTube no es válido.'; return; } data.v = id; }
    for (const k of Object.keys(data)) if (Array.isArray(data[k]) ? !data[k].length : !data[k]) delete data[k];

    persist();
    const url = location.href.split('#')[0] + '#d=' + await pack(data);
    if (url.length > MAX_URL) {
      err.textContent = `Ya no cabe más texto en un QR (sobran ${url.length - MAX_URL} caracteres). Acorta un poco.`;
      return;
    }
    err.textContent = '';
    try {
      const qr = $('qr'); qr.innerHTML = '';
      const cv = drawQR(url, qr);
      $('dl').href = cv.toDataURL('image/png');
      $('url').textContent = url;
      $('open').href = url;
      $('out').hidden = false;
      qr.scrollIntoView({ behavior: 'smooth' });
    } catch (e) { err.textContent = 'No se pudo generar el QR: ' + e.message; }
  }
}

function drawQR(text, box) {
  const q = qrcode(0, 'L');           // 0 = tamaño automático (hasta versión 40)
  q.addData(text); q.make();
  const n = q.getModuleCount(), cell = Math.max(6, Math.floor(480 / (n + 8))), size = (n + 8) * cell;
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) x.fillRect((c + 4) * cell, (r + 4) * cell, cell, cell);
  cv.style.cssText = 'max-width:100%;height:auto';
  box.appendChild(cv);
  return cv;
}

/* ============ Router ============ */
async function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  try {
    if (p.get('d')) return renderCard(await unpack(p.get('d')));
    if (p.get('n')) {   // carnets viejos (antes de la compresión) siguen funcionando
      return renderCard({
        n: p.get('n'), c: p.get('c'), s: p.get('s'), a: p.get('a'), x: p.get('x'), v: p.get('v'),
        h: p.getAll('h'), k: p.getAll('k').map((k, i) => [k, p.getAll('t')[i] || ''])
      });
    }
  } catch (e) {
    app.innerHTML = '<h1>No se pudo abrir el carnet</h1><p>El link está incompleto o dañado. Genera el QR de nuevo.</p>';
    return;
  }
  renderForm();
}
window.addEventListener('hashchange', route);
route();
</script>
